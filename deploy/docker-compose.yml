# Trovana - WAHA (motor GOWS) para o "Grupos no Automático".
#
# Usa a imagem oficial do WAHA Core (gratuita), fixada numa versão testada.
# Nada do código deles é alterado: o backend da Trovana fala com o WAHA pela API.
#
# Subir:            docker compose up -d
# Subir com HTTPS:  docker compose --profile https up -d
# Passo a passo completo em deploy/README.md.

name: trovana-waha

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  waha:
    # Versão fixa. Para atualizar, troque WAHA_IMAGE no .env e teste antes.
    # Servidor ARM (ex.: Oracle Ampere): use devlikeapro/waha:gows-arm-<versão>.
    image: ${WAHA_IMAGE:-devlikeapro/waha:gows-2026.9.2}
    container_name: trovana-waha
    restart: unless-stopped
    init: false # a imagem já roda com tini
    stop_grace_period: 30s

    # Sem HTTPS na frente: escuta só no endereço de WAHA_BIND (padrão 127.0.0.1).
    # Com o profile "https", o Caddy fala com o WAHA pela rede interna.
    ports:
      - "${WAHA_BIND:-127.0.0.1}:${WAHA_PORT:-3000}:3000"

    environment:
      # Chave da API (obrigatória). A mesma vai em WAHA_API_KEY no backend.
      WAHA_API_KEY: ${WAHA_API_KEY:?defina WAHA_API_KEY no .env}

      # Motor
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_AUTO_START_DELAY_SECONDS: ${WAHA_AUTO_START_DELAY_SECONDS:-5}
      WAHA_PRINT_QR: "False"

      # Painel e documentação ficam desligados em produção.
      # Para depurar, ligue no .env e defina usuário e senha.
      WAHA_DASHBOARD_ENABLED: ${WAHA_DASHBOARD_ENABLED:-False}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-}
      WHATSAPP_SWAGGER_ENABLED: ${WHATSAPP_SWAGGER_ENABLED:-False}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:-}

      # A Trovana só envia (imagem por URL e texto) e ouve session.status.
      # Não baixa mídia recebida e ignora status, canais e listas de transmissão
      # para economizar disco e CPU. Grupos NÃO podem ser ignorados.
      WHATSAPP_DOWNLOAD_MEDIA: "False"
      WAHA_SESSION_CONFIG_IGNORE_STATUS: "True"
      WAHA_SESSION_CONFIG_IGNORE_CHANNELS: "True"
      WAHA_SESSION_CONFIG_IGNORE_BROADCAST: "True"

      # Endereço público (usado em links que o WAHA gera). Vazio = padrão.
      WAHA_BASE_URL: ${WAHA_BASE_URL:-}

      # Logs
      WAHA_LOG_FORMAT: JSON
      WAHA_LOG_LEVEL: ${WAHA_LOG_LEVEL:-info}
      WAHA_HTTP_LOG_LEVEL: ${WAHA_HTTP_LOG_LEVEL:-warn}
      TZ: America/Sao_Paulo

    volumes:
      # Login de cada número. Se perder, todo mundo precisa reconectar.
      - waha_sessions:/app/.sessions

    dns:
      - 1.1.1.1
      - 8.8.8.8

    ulimits:
      nofile:
        soft: 65535
        hard: 65535

    security_opt:
      - no-new-privileges:true

    deploy:
      resources:
        limits:
          memory: ${WAHA_MEMORY_LIMIT:-3g}

    healthcheck:
      # A imagem gows não tem wget/curl; o node já está lá.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    networks: [waha]
    logging: *logging

  # HTTPS na frente do WAHA (opcional). Use quando o backend estiver em outro
  # servidor: certificado automático e só os IPs de WAHA_ALLOWED_IPS entram.
  caddy:
    profiles: ["https"]
    image: caddy:2.8.4-alpine
    container_name: trovana-waha-caddy
    restart: unless-stopped
    depends_on:
      waha:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      WAHA_DOMAIN: ${WAHA_DOMAIN:-}
      WAHA_ALLOWED_IPS: ${WAHA_ALLOWED_IPS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks: [waha]
    logging: *logging

volumes:
  waha_sessions:
    name: trovana_waha_sessions
  caddy_data:
    name: trovana_waha_caddy_data
  caddy_config:
    name: trovana_waha_caddy_config

networks:
  waha:
    name: trovana_waha
